<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181518">
  <title>Game · 选择游戏</title>
  <style>
    :root {color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#181518;color:#f1e7dd}
    * {box-sizing:border-box}
    body {margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,#33252e 0,transparent 65%),#181518;padding:max(28px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left));-webkit-text-size-adjust:100%}
    main {width:min(100%,440px);min-width:0}
    header {margin-bottom:clamp(24px,6vw,36px)}
    .brand {margin:0 0 13px;color:#baa896;font-size:11px;letter-spacing:4px}
    h1 {margin:0;font-size:clamp(24px,6vw,32px);font-weight:500;letter-spacing:1px;line-height:1.4}
    .intro {margin:10px 0 0;color:#aa9b98;font-size:13px;line-height:1.7}
    nav {display:grid;gap:16px}
    .card {display:flex;align-items:center;gap:18px;min-width:0;min-height:clamp(144px,22dvh,178px);padding:clamp(20px,6vw,30px);border:1px solid #a98f9c3d;border-radius:24px;color:inherit;text-decoration:none;background:linear-gradient(125deg,#352b38,#252128);box-shadow:inset 0 1px 0 #ffffff08,0 12px 32px #00000018;transition:transform 160ms ease,border-color 160ms ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .card.enfp {background:linear-gradient(125deg,#3c2d2b,#2b2123);border-color:#b58d783d}
    .words {min-width:0;flex:1}
    .number {display:block;margin-bottom:13px;font-size:10px;letter-spacing:2px;color:#b5a0b6}
    .enfp .number {color:#c4a18b}
    h2 {margin:0;font-size:clamp(31px,9vw,40px);line-height:1.2;font-weight:500;letter-spacing:3px}
    .enter {display:block;margin-top:12px;color:#baaba7;font-size:12px}
    .arrow {width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid #d2bba22b;border-radius:50%;color:#d9c1aa}
    svg {width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .card:active {transform:scale(.98)}
    .card:focus-visible {outline:2px solid #e1c5a8;outline-offset:5px}
    footer {margin-top:28px;color:#897d7c;font-size:10px;letter-spacing:2px;text-align:center}
    @media(hover:hover) {.card:hover {transform:translateY(-2px);border-color:#c9ada270}}
    @media(prefers-reduced-motion:reduce) {.card {transition:none}.card:hover,.card:active {transform:none}}
  </style>
</head>
<body>
  <main>
    <header>
      <p class="brand">GAME</p>
      <h1>选择游戏</h1>
      <p class="intro">选一个入口，开始游戏。</p>
    </header>
    <nav aria-label="游戏入口">
      <a class="card intj" href="./INTJ.html" aria-label="进入 INTJ 游戏">
        <div class="words"><span class="number">01</span><h2>INTJ</h2><span class="enter">点击进入</span></div>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
      </a>
      <a class="card enfp" href="./ENFP.html" aria-label="进入 ENFP 游戏">
        <div class="words"><span class="number">02</span><h2>ENFP</h2><span class="enter">点击进入</span></div>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
      </a>
    </nav>
    <footer>INTJ & ENFP</footer>
  </main>
</body>
</html>
